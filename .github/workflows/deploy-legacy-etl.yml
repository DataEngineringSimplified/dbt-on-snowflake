name: Deploy Legacy ETL Pipeline

on:
  workflow_dispatch:
    inputs:
      skip_data_load:
        description: 'Skip data load steps (02 and 03) and only run deploy'
        required: false
        default: 'false'
        type: boolean

env:
  SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWSQL_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWSQL_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWSQL_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SnowSQL
        run: |
          curl -o snowsql-linux.bash https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/1.3/linux_x86_64/snowsql-1.3.2-linux_x86_64.bash
          SNOWSQL_DEST=~/bin SNOWSQL_LOGIN_SHELL=~/.profile bash snowsql-linux.bash
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Fix file paths in SQL scripts
        run: |
          REPO_DIR="${GITHUB_WORKSPACE}"
          sed -i "s|file://git-repo/data/|file://${REPO_DIR}/hr-analytics-data/full-data/|g" legacy-etl-setup/02-put_full_load.sql
          sed -i "s|file://git-repo/daily-delta/|file://${REPO_DIR}/hr-analytics-data/daily-delta/|g" legacy-etl-setup/03-put_delta_load.sql

      - name: Run 01 - Deploy database objects
        run: snowsql -f legacy-etl-setup/01-hr-analytics-deploy.sql -o exit_on_error=true

      - name: Run 02 - Full data load
        if: ${{ inputs.skip_data_load != 'true' }}
        run: snowsql -f legacy-etl-setup/02-put_full_load.sql -o exit_on_error=true

      - name: Run 03 - Delta data load
        if: ${{ inputs.skip_data_load != 'true' }}
        run: snowsql -f legacy-etl-setup/03-put_delta_load.sql -o exit_on_error=true
